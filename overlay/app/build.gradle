plugins {
  id 'com.android.application'
}

android {
  compileSdkVersion 31
  buildToolsVersion '30.0.3'

  defaultConfig {
    applicationId "pl.whisperfiles"
    minSdkVersion 26
    targetSdkVersion 31
    versionCode 1
    versionName "0.1.0"

    externalNativeBuild {
      cmake {
        cppFlags ""
        arguments "-DCMAKE_BUILD_TYPE=Release"
      }
    }
    ndk {
      abiFilters 'arm64-v8a'
    }
  }

  buildTypes {
    debug {
      externalNativeBuild {
        cmake { arguments "-DCMAKE_BUILD_TYPE=Release" }
      }
    }
    release {
      signingConfig signingConfigs.debug
      minifyEnabled false
      externalNativeBuild {
        cmake { arguments "-DCMAKE_BUILD_TYPE=Release" }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/jni/whisper/CMakeLists.txt"
    }
  }

  ndkVersion "25.2.9519653"

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
}
