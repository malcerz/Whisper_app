name: Check Android signing secrets

on:
  push:
    branches: [check-signing-secrets]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets presence
        shell: bash
        env:
          A_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          A_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          A_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          A_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          B_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          B_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          B_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          B_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for n in A_KEYSTORE_BASE64 A_KEYSTORE_PASSWORD A_KEY_ALIAS A_KEY_PASSWORD B_KEYSTORE_BASE64 B_KEYSTORE_PASSWORD B_KEY_ALIAS B_KEY_PASSWORD; do
            if [ -n "${!n}" ]; then
              echo "$n=SET"
            else
              echo "$n=MISSING"
            fi
          done
