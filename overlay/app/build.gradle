plugins {
  id 'com.android.application'
}

android {
  namespace "pl.whisperfiles"
  compileSdkVersion 36

  lint {
    // v0.3 intentionally keeps targetSdk at 31 for the current Android behavior.
    disable 'ExpiredTargetSdkVersion'
  }

  defaultConfig {
    applicationId "pl.whisperfiles"
    minSdkVersion 26
    targetSdkVersion 31
    versionCode 10
    versionName "0.4.6"

    externalNativeBuild {
      cmake {
        cppFlags ""
        arguments "-DCMAKE_BUILD_TYPE=Release"
      }
    }
    ndk {
      abiFilters 'arm64-v8a'
    }
  }

  buildTypes {
    debug {
      externalNativeBuild {
        cmake { arguments "-DCMAKE_BUILD_TYPE=Release" }
      }
    }
    release {
      signingConfig signingConfigs.debug
      minifyEnabled false
      externalNativeBuild {
        cmake { arguments "-DCMAKE_BUILD_TYPE=Release" }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/jni/whisper/CMakeLists.txt"
    }
  }

  ndkVersion "25.2.9519653"

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation "androidx.media3:media3-exoplayer:1.11.0"
  implementation "androidx.media3:media3-ui:1.11.0"
  implementation "androidx.media3:media3-transformer:1.11.0"
  implementation "androidx.media3:media3-effect:1.11.0"
  implementation "androidx.media3:media3-common:1.11.0"
  testImplementation "junit:junit:4.13.2"
}
