name: Build Whisper Captions 2 APK

on:
  workflow_dispatch:
  push:
    branches: [whisper-captions-2, whisper-captions-2-word-counter]

permissions:
  contents: write

env:
  WHISPER_COMMIT: 52a939a2a762224e255d366c1182b2af4dd1a032
  APP_VERSION: v2.1.0
  RELEASE_TAG: whisper-captions-2-v2.1.0
  ANDROID_PROJECT: whisper.cpp/examples/whisper.android.java

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v6

      - name: Ustaw Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;25.2.9519653
            cmake;3.22.1

      - name: Skonfiguruj Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Pobierz przypięte źródła whisper.cpp
        shell: bash
        run: |
          git clone https://github.com/ggml-org/whisper.cpp.git whisper.cpp
          git -C whisper.cpp checkout --detach "$WHISPER_COMMIT"

      - name: Nałóż overlay aplikacji i konfigurację Gradle
        shell: bash
        run: |
          rm -rf "$ANDROID_PROJECT/app/src/main/java"
          mkdir -p "$ANDROID_PROJECT/app/src/main/java"
          cp -a overlay/app/. "$ANDROID_PROJECT/app/"
          cp root-patches/build.gradle "$ANDROID_PROJECT/build.gradle"
          cp root-patches/gradle.properties "$ANDROID_PROJECT/gradle.properties"
          cp root-patches/gradle-wrapper.properties \
            "$ANDROID_PROJECT/gradle/wrapper/gradle-wrapper.properties"
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK_DIR"
          printf 'sdk.dir=%s\n' "$SDK_DIR" > "$ANDROID_PROJECT/local.properties"
          chmod +x "$ANDROID_PROJECT/gradlew"

      - name: Testy, lint i kompilacja APK
        shell: bash
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          ./gradlew --no-daemon clean test lint :app:assembleDebug :app:assembleRelease

      - name: Przygotuj artefakty APK
        shell: bash
        run: |
          mkdir -p out
          cp "$ANDROID_PROJECT/app/build/outputs/apk/debug/app-debug.apk" \
            "out/WhisperCaptions2-$APP_VERSION-arm64-debug.apk"
          cp "$ANDROID_PROJECT/app/build/outputs/apk/release/app-release.apk" \
            "out/WhisperCaptions2-$APP_VERSION-arm64-release.apk"

      - name: Zapisz APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: WhisperCaptions2-${{ env.APP_VERSION }}-arm64
          path: out/*.apk
          if-no-files-found: error

      - name: Utwórz GitHub Release
        if: github.ref == 'refs/heads/whisper-captions-2'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="out/WhisperCaptions2-$APP_VERSION-arm64-release.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Whisper Captions 2 $APP_VERSION" \
              --notes "Teleprompter sterowany lekkim lokalnym licznikiem aktywności mowy: nie rozpoznaje treści słów, tylko przesuwa tekst o kolejne słowa. Dodano konfigurowalną liczbę słów na ekranie (3–30) i szybkie przyciski −/+ podczas nagrania."
          fi
